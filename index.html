<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>Vagon Bakım ve Takip Sistemi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
:root{
  --bg:#1a1a1a; --card:#212121; --card2:#2b2b2b; --line:#333;
  --blue:#1f6aa5; --blue-d:#144870; --green:#2FA572; --red:#E74C3C; --amber:#f39c12;
  --txt:#eaeaea; --mut:#9a9a9a;
  --radius:14px; --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background:var(--bg); color:var(--txt);
  min-height:100dvh; padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
input,select,textarea{
  font:inherit;width:100%;background:var(--card2);color:var(--txt);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
label{display:block;font-size:.8rem;color:var(--mut);margin:12px 0 5px}
header{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(26,26,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
header img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.h-title{display:flex;flex-direction:column;line-height:1.25}
.h-title b{font-size:.95rem}
.h-title span{font-size:.72rem;color:#5b9bd5;letter-spacing:.4px}
.filters{display:flex;gap:8px;padding:12px 14px 4px;flex-wrap:wrap}
.filters input{flex:1;min-width:150px}
.filters select{width:auto;flex:0 0 auto}
.count-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:.8rem;color:var(--mut)}
.count-bar b{color:var(--amber)}
.list{padding:0 14px}
.vcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px;transition:transform .12s ease;
}
.vcard:active{transform:scale(.985)}
.vcard .vno{font-weight:700;font-size:1rem;word-break:break-word}
.vrow{display:flex;gap:10px 18px;flex-wrap:wrap;margin-top:7px;font-size:.78rem;color:var(--mut)}
.vrow b{color:var(--txt);font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:600}
.b-done{background:rgba(47,165,114,.18);color:#4fc08d}
.b-devam{background:rgba(243,156,18,.16);color:#f5b041}
.b-bekliyor{background:rgba(231,76,60,.15);color:#f1948a}
.sure{color:var(--amber)}
.pcard .ptip{font-weight:700}
.pcard .pmarka{color:#5b9bd5;font-size:.85rem}
.wait{color:var(--amber);font-weight:600}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:#151515;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
nav button{
  background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:.68rem;border-radius:0;height:var(--nav-h);
}
nav button .ic{font-size:1.25rem;line-height:1}
nav button.active{color:var(--blue);background:linear-gradient(transparent 55%,rgba(31,106,165,.12))}
.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  width:56px;height:56px;border-radius:18px;background:var(--blue);color:#fff;font-size:1.6rem;
  box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:55;display:flex;align-items:center;justify-content:center;
}
.fab:active{background:var(--blue-d)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{
  background:var(--card);width:min(560px,100%);max-height:88dvh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-size:1.05rem;margin-bottom:4px}
.sheet .grab{width:44px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px;font-weight:600;font-size:.95rem}
.btn-p{background:var(--blue);color:#fff}
.btn-p:active{background:#144870}
.btn-r{background:var(--red);color:#fff}
.btn-s{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#f1948a;font-size:.8rem;margin-top:8px;min-height:1em}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:.86rem;margin-top:10px}
.det dt{color:var(--mut)}
.det dd{color:var(--txt);word-break:break-word;text-align:right}
.aciklama{
  margin-top:12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:11px;font-size:.83rem;white-space:pre-wrap;word-break:break-word;color:#d6d6d6;
}
.report{padding:14px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.rcard h4{font-size:.95rem;margin-bottom:6px}
.rcard p{font-size:.78rem;color:var(--mut);margin-bottom:12px}
.empty{padding:40px 20px;text-align:center;color:var(--mut);font-size:.85rem}
.hero{text-align:center;padding:48px 20px 24px;color:var(--mut)}
.hero-ic{font-size:3rem;margin-bottom:12px}
.hero h3{color:var(--txt);font-size:1.05rem;margin-bottom:10px}
.hero p{font-size:.85rem;line-height:1.7}
.hero p b{color:var(--txt)}
.hero-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.hero .btn{display:inline-block;flex:none;max-width:280px}
.btn-geri{width:100%;margin-bottom:14px;flex:none;text-align:left}
.hidden{display:none!important}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 84px);
  background:#2FA572;color:#fff;padding:11px 20px;border-radius:12px;font-size:.85rem;z-index:200;
  box-shadow:0 4px 14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;
}
.toast.show{opacity:1}
.toast.warn{background:var(--amber)}
@media (min-width:600px){
  .list,.filters{max-width:900px;margin:0 auto}
}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="logo">
  <div class="h-title">
    <b>Vagon Bakım ve Takip Sistemi</b>
    <span>GEBZE VAGON BİLİM KÜLTÜR KULÜBÜ</span>
  </div>
</header>

<!-- SEKMELER -->
<main id="page-vagon" class="page">
  <div class="filters">
    <input id="f-vagon" type="search" placeholder="Vagon No ile Ara...">
    <select id="f-ay">
      <option value="all">Tüm Zamanlar</option>
      <option value="devam">Devam Edenler</option>
    </select>
  </div>
  <div class="count-bar"><span id="vagon-count">Toplam vagon sayısı: 0</span><span id="vagon-info"></span></div>
  <div id="vagon-list" class="list"></div>
</main>

<main id="page-parca" class="page hidden">
  <div class="filters"><input id="f-parca" type="search" placeholder="Vagon No Ara..."></div>
  <div class="count-bar"><span id="parca-count"></span></div>
  <div id="parca-list" class="list"></div>
</main>

<main id="page-demirbas" class="page hidden">
  <div class="count-bar"><span id="demirbas-count"></span></div>
  <div id="demirbas-list" class="list"></div>
</main>

<main id="page-rapor" class="page hidden">
  <div class="report" id="rapor-icerik"></div>
</main>

<!-- ALT NAV -->
<nav>
  <button data-page="vagon" class="active"><span class="ic">🚂</span>Vagon Takibi</button>
  <button data-page="parca"><span class="ic">⚙️</span>Parçalar</button>
  <button data-page="demirbas"><span class="ic">📦</span>Demirbaş</button>
  <button data-page="rapor"><span class="ic">📊</span>Rapor</button>
</nav>

<button id="fab" class="fab">＋</button>

<!-- MODAL -->
<div id="overlay" class="overlay"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
